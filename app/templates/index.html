{% extends "base.html" %}
{% block content %}

<div class="bg-white rounded-xl shadow p-4 mb-4">
    <label for="buscador" class="block text-sm font-semibold text-slate-700 mb-2">
        Nombre, codigo de control o numero de estacion
    </label>
    <div class="flex gap-2">
        <input
            id="buscador"
            name="q"
            type="search"
            placeholder="Ej: FRCT, 12, Juan Gomez..."
            autocomplete="off"
            class="flex-1 border border-slate-300 rounded-lg px-3 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
            hx-get="/buscar"
            hx-trigger="keyup changed delay:300ms, search"
            hx-target="#resultados"
            hx-include="this"
        >
        <label class="flex items-center justify-center w-14 h-auto bg-blue-600 active:bg-blue-700 text-white rounded-lg cursor-pointer">
            <input id="camara" type="file" accept="image/*" capture="environment" class="hidden">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/>
                <circle cx="12" cy="13" r="3.5"/>
            </svg>
        </label>
    </div>
    <p id="ocr-estado" class="text-xs text-slate-400 mt-2"></p>
</div>

{% include "partials/mueble.html" %}

<div id="resultados">
    <p class="text-slate-400 text-sm text-center mt-8">
        {{ total }} asignaciones cargadas. Escribe algo arriba para buscar.
    </p>
</div>

<script>
    const CLASES_RESALTADO = [
        "ring-4", "ring-yellow-400", "bg-yellow-100", "border-yellow-400", "animate-pulse",
    ];

    function resaltarEstaciones(estaciones) {
        document.querySelectorAll(".casillero").forEach((el) => {
            el.classList.remove(...CLASES_RESALTADO);
        });
        let primero = null;
        estaciones.forEach((n) => {
            const el = document.getElementById("casillero-" + n);
            if (el) {
                el.classList.add(...CLASES_RESALTADO);
                primero = primero || el;
            }
        });
        if (primero) {
            primero.scrollIntoView({ behavior: "smooth", block: "center" });
        }
    }
</script>

<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
    const inputCamara = document.getElementById("camara");
    const buscador = document.getElementById("buscador");
    const estado = document.getElementById("ocr-estado");

    inputCamara.addEventListener("change", async (evento) => {
        const archivo = evento.target.files[0];
        if (!archivo) return;

        estado.textContent = "Leyendo texto de la foto...";
        try {
            const resultado = await Tesseract.recognize(archivo, "eng", {
                logger: () => {},
            });
            const texto = resultado.data.text || "";
            // Nos quedamos solo con letras/numeros, la camara no lee codigos de barras.
            const limpio = texto.replace(/[^A-Za-z0-9]/g, " ").trim().split(/\s+/)[0] || "";

            if (limpio) {
                buscador.value = limpio;
                buscador.dispatchEvent(new Event("search"));
                estado.textContent = "Detectado: " + limpio + " (podes corregirlo a mano si hizo falta)";
            } else {
                estado.textContent = "No se detecto texto claro, intenta con mas luz o mas cerca.";
            }
        } catch (error) {
            estado.textContent = "No se pudo leer la foto, intenta de nuevo.";
        }
        inputCamara.value = "";
    });
</script>
{% endblock %}
