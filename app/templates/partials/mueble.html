<div class="bg-white rounded-xl shadow p-3 mb-4">
    <h2 class="text-sm font-semibold text-slate-700 mb-2">Mueble de radios</h2>
    <div class="grid grid-cols-4 gap-1 max-w-xs mx-auto">
        {% for n in rango_estaciones %}
        {% set ocupantes = mueble.get(n, []) %}
        <div
            id="casillero-{{ n }}"
            data-estacion="{{ n }}"
            class="casillero aspect-square rounded border border-slate-200 bg-slate-50 flex flex-col items-center justify-center gap-0.5 p-0.5 transition-colors duration-300"
        >
            <span class="text-[8px] font-bold text-slate-400 leading-none">{{ n }}</span>
            <div class="flex gap-0.5 flex-wrap justify-center">
                {% for persona in ocupantes %}
                <span
                    class="w-2.5 h-2.5 rounded-full bg-blue-100 text-blue-700 text-[6px] font-bold flex items-center justify-center leading-none"
                    title="{{ persona.nombre }}"
                >{{ persona.nombre[0] }}</span>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
