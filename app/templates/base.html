<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>{% block title %}Control QPR asignados{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        /* Evita el zoom molesto de iOS al enfocar inputs */
        input[type="text"], input[type="search"] { font-size: 16px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
    <header class="bg-blue-700 text-white px-4 py-3 shadow sticky top-0 z-10">
        <h1 class="text-lg font-bold"> Control QPR asignados</h1>
        <p class="text-blue-100 text-xs">Consulta rapida por nombre, control o estacion</p>
    </header>
    <main class="max-w-xl mx-auto p-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
