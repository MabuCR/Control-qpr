<div class="bg-white rounded-xl shadow p-2 mb-4">
    <h2 class="text-sm font-semibold text-slate-700 mb-2">Mueble de radios</h2>
    <div class="grid grid-cols-4 gap-1">
        {% for n in rango_estaciones %}
        {% set ocupantes = mueble.get(n, []) %}
        <div
            id="casillero-{{ n }}"
            data-estacion="{{ n }}"
            class="casillero rounded border border-slate-200 bg-slate-50 flex flex-col items-center justify-start gap-0.5 p-0.5 transition-colors duration-300 min-h-[2.75rem]"
        >
            <span class="text-[8px] font-bold text-slate-400 leading-none">{{ n }}</span>
            {% for persona in ocupantes %}
            <span class="text-[6.5px] leading-[1.1] text-slate-600 text-center break-words w-full">
                {{ persona.nombre }}
            </span>
            {% endfor %}
            {% if not ocupantes %}
            <span class="text-[6.5px] text-slate-300">vacio</span>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</div>
